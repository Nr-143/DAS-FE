  <!-- ==================== Login Modal ==================== -->
  <div class="modal-overlay" id="modal-login-overlay">
    <div class="modal modal--auth" role="dialog" aria-modal="true" aria-labelledby="modal-login-title">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-login-title">Log in to OneStep Journey</h2>
        <button class="modal__close" id="btn-login-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal__body">
        <p class="modal__subtext" id="login-modal-subtext">Log in to save your progress across devices.</p>
        
        <div id="auth-error-banner" class="auth-error-banner" style="display:none;"></div>

        <!-- Google OAuth Sign In -->
        <div class="auth-google-wrapper">
          <button type="button" id="btn-google-login" class="btn-google-login">
            <svg width="20" height="20" viewBox="0 0 24 24" style="flex-shrink:0;">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>

            </svg>
            <span>Continue with Google</span>
          </button>
          
          <div id="g_id_signin_container" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== Toast ==================== -->

  <!-- ==================== App Container ==================== -->
  <div class="app-container">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Topic Roadmap Navigation">
      <div class="sidebar__header">
        <h3 class="sidebar__title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          Topic Roadmap
        </h3>
        <button class="sidebar__close" id="sidebar-close" aria-label="Close Sidebar">&times;</button>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav">
        <!-- Rendered by JS from topics.json -->
      </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="content-area">
      <!-- Progress Section -->
      <section class="progress-section" id="progress-section" aria-label="Learning progress">
        <div class="progress-label">
          <span>Overall Progress</span>
          <strong id="progress-text">0 / 0 completed</strong>
        </div>
        <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </section>

      <!-- Main Content Container (Grid or Lesson View) -->
      <main class="main-content" id="main-content">
        <!-- Rendered dynamically by JS -->
      </main>
    </div>
  </div>



  <!-- ==================== Toast ==================== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
