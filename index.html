<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Tracker — Master Data Structures & Algorithms</title>
  <meta name="description" content="A personal DSA learning tracker with an unlock-based roadmap, progress tracking, notes, and theme switching." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236C63FF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- ==================== Header ==================== -->
  <header class="header" id="header">
    <div class="header__left">
      <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle Topic Navigation" aria-expanded="false">
        <span class="btn__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </span>
      </button>
      <a href="#" class="header__logo" id="header-logo">
        <div class="header__logo-icon" aria-hidden="true">⟨/⟩</div>
        <div class="header__logo-text"><span>DSA</span> Tracker</div>
      </a>
    </div>

    <div class="header__right">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>

      <div class="header__actions header__actions--desktop" id="header-actions">
        <button class="btn" id="btn-notes" aria-label="Open notes">
          <span class="btn__icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
          </span>
          <span class="btn__label">Notes</span>
        </button>
        <button class="btn" id="btn-export" aria-label="Export progress">
          <span class="btn__icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </span>
          <span class="btn__label">Export</span>
        </button>
        <button class="btn" id="btn-import" aria-label="Import progress">
          <span class="btn__icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </span>
          <span class="btn__label">Import</span>
        </button>
        <button class="btn" id="btn-reset" aria-label="Reset progress">
          <span class="btn__icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </span>
          <span class="btn__label">Reset</span>
        </button>
        <button class="btn btn--icon" id="btn-theme" aria-label="Toggle theme">
          <span class="btn__icon" id="theme-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== App Container ==================== -->
  <div class="app-container">
    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Left Navigation Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Topic Roadmap Navigation">
      <div class="sidebar__header">
        <h3 class="sidebar__title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          Topic Roadmap
        </h3>
        <button class="sidebar__close" id="sidebar-close" aria-label="Close Sidebar">&times;</button>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav">
        <!-- Rendered by JS from topics.json -->
      </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="content-area">
      <!-- Progress Section -->
      <section class="progress-section" id="progress-section" aria-label="Learning progress">
        <div class="progress-label">
          <span>Overall Progress</span>
          <strong id="progress-text">0 / 0 completed</strong>
        </div>
        <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </section>

      <!-- Main Content Container (Grid or Lesson View) -->
      <main class="main-content" id="main-content">
        <!-- Rendered dynamically by JS -->
      </main>
    </div>
  </div>

  <!-- ==================== Notes Panel ==================== -->
  <div class="notes-overlay" id="notes-overlay"></div>
  <aside class="notes-panel" id="notes-panel" aria-label="Notes panel">
    <div class="notes-panel__header">
      <h2 class="notes-panel__title" style="display:flex;align-items:center;gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        My Notes
      </h2>
      <button class="notes-panel__close" id="btn-notes-close" aria-label="Close notes">&times;</button>
    </div>
    <div class="notes-panel__body">
      <textarea
        class="notes-panel__textarea"
        id="notes-textarea"
        placeholder="Write your study notes here…&#10;&#10;These are saved automatically in your browser."
        aria-label="Notes editor"
      ></textarea>
    </div>
  </aside>

  <!-- ==================== Export Modal ==================== -->
  <div class="modal-overlay" id="modal-export-overlay">
    <div class="modal" role="dialog" aria-labelledby="modal-export-title">
      <h2 class="modal__title" id="modal-export-title" style="display:flex;align-items:center;gap:8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Progress
      </h2>
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px;">Copy this JSON to back up your progress.</p>
      <textarea class="modal__textarea" id="export-textarea" readonly aria-label="Export data"></textarea>
      <div class="modal__actions">
        <button class="btn" id="btn-export-copy">
          <span class="btn__icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </span>
          <span class="btn__label">Copy</span>
        </button>
        <button class="btn" id="btn-export-close">
          <span class="btn__label">Close</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== Import Modal ==================== -->
  <div class="modal-overlay" id="modal-import-overlay">
    <div class="modal" role="dialog" aria-labelledby="modal-import-title">
      <h2 class="modal__title" id="modal-import-title" style="display:flex;align-items:center;gap:8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import Progress
      </h2>
      <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px;">Paste your previously exported JSON below.</p>
      <textarea class="modal__textarea" id="import-textarea" placeholder='Paste JSON here…' aria-label="Import data"></textarea>
      <div class="modal__actions">
        <button class="btn btn--primary" id="btn-import-apply">
          <span class="btn__label">Apply</span>
        </button>
        <button class="btn" id="btn-import-close">
          <span class="btn__label">Cancel</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== Toast ==================== -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ==================== Content Modules ==================== -->
  <script src="content/lessons/what-is-dsa.js"></script>
  <script src="content/lessons/variables-memory.js"></script>
  <script src="content/lessons/primitives.js"></script>
  <script src="content/lessons/objects.js"></script>
  <script src="content/lessons/function-calls.js"></script>
  <script src="content/lessons/recursion.js"></script>
  <script src="content/lessons/big-o.js"></script>
  <script src="content/lessons/space-complexity.js"></script>
  <script src="content/lessons/control-flow.js"></script>
  <script src="content/lessons/core-built-ins.js"></script>
  <script src="content/lessons/es6-plus.js"></script>
  <script src="content/lessons/arrays.js"></script>
  <script src="content/lessons/strings.js"></script>
  <script src="content/lessons/linked-list-singly.js"></script>
  <script src="content/lessons/linked-list-doubly.js"></script>
  <script src="content/lessons/stack.js"></script>
  <script src="content/lessons/queue.js"></script>
  <script src="content/lessons/linear-search.js"></script>
  <script src="content/lessons/binary-search.js"></script>
  <script src="content/lessons/bubble-sort.js"></script>
  <script src="content/lessons/selection-sort.js"></script>
  <script src="content/lessons/insertion-sort.js"></script>
  <script src="content/lessons/merge-sort.js"></script>
  <script src="content/lessons/quick-sort.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
